[project]
name = "betfinder"
version = "1.4.0"
description = "European bookmaker odds scanner and value-bet analysis"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1.2",
  "pydantic>=2.9",
  "httpx>=0.27",
  "tzdata>=2024.1",
  "redis>=5.0",
]

[tool.vercel]
entrypoint = "main:app"
